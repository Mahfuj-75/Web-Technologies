<!DOCTYPE html>
<html>
    <head>
        <title>
            Lab Task 1
        </title>
    </head>

    <body>
        <center>
        <h1>University Admission Form</h1>
        </center>

        <center>
            <fieldset>
            <form>
               <table>
                <tr>
                    <td>First Name:</td>
                    <td>
                        <input type="text" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        Gender:
                    </td>
                    <td>
                        <input type="radio" value="Male" name="Gender"> Male
                        
                        <input type="radio" value="Female" name="Gender"> Female
                         
                    </td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" required>
                    </td>
                    
                </tr>
                <tr>
                    <td>Age:</td>
                    <td>
                        <input type="number" required>
                    </td>
                </tr>

                <tr>
                    <td>Father's Name:</td>
                    <td>
                        <input type="text" required>
                    </td>
                </tr>
                <tr>
                    <td>Mother's Name:</td>
                    <td>
                        <input type="text" required>
                    </td>
                </tr>
                
                <tr>
                    <td>Nationality:</td>
                    <td>
                        <input type="text" required>
                    </td>
                </tr>

               
                
                <tr>
                    <td>
                       Interest:
                    </td>
                    <td>
                        <input type="checkbox" >Cricket
                       
                        <input type="checkbox" >Football
                        
                        <input type="checkbox">Mobile Game
                       
                    </td>
                </tr>
                <tr>
                    <td>
                        Select Course:
                    </td>
                    <td>
                        
                        <select>
                            <option>WebTech</option>
                            <option>Software Engineering</option>
                            <option>OOP2</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        Date:
                    </td>
                    <td>
                        <input type="date">
                    </td>
                </tr>
                <tr>
                    <td>
                        File Upload: 
                    </td>
                    <td>
                        <input type="file">
                    </td>
                </tr>

                <tr>
                    <td>All Required are fullfilled click submit button</td>
                    <td>
                       <input type="submit">
                    </td>
                    
                </tr>
                </table>
</form>
</fieldset>
</center>



        
    </body>
</html>
